# Fichier de configuration EnergyMe Monitor
# Copiez ce fichier en config.ini et adaptez les valeurs.
# config.ini est dans .gitignore – ne le commitez jamais.

[energyme]
# Adresse IP ou mDNS du dispositif EnergyMe (ESP32)
host = energyme.local

# Identifiants (HTTP Digest Auth)
username = admin
password = energyme

# Délai d'attente des requêtes HTTP en secondes.
# Garder court (3-5s) : avec l'auto-refresh, un timeout long
# sature le pool de threads Waitress.
timeout = 5

# Délai en millisecondes entre chaque appel API lors d'un rafraîchissement
# (évite de flood le dispositif EnergyMe sur le Wi-Fi)
poll_delay_ms = 200

[server]
# Adresse et port du serveur web Pyramid/Waitress
host = 0.0.0.0
port = 6543

[graylog]
# Hôte et port de l'API Graylog (interface HTTP REST)
host = localhost
port = 9000
username = admin
password = admin
