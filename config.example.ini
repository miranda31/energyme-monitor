# Fichier de configuration EnergyMe Monitor
# Copiez ce fichier en config.ini et adaptez les valeurs.
# config.ini est dans .gitignore – ne le commitez jamais.

[energyme]
# Adresse IP ou mDNS du dispositif EnergyMe (ESP32)
host = energyme.local

# Identifiants (HTTP Digest Auth)
username = admin
password = energyme

# Délai d'attente des requêtes HTTP en secondes
timeout = 10

[server]
# Adresse et port du serveur web Pyramid/Waitress
host = 0.0.0.0
port = 6543
