[app:main]
use = call:energyme:main
pyramid.reload_templates = true
pyramid.debug_authorization = false
pyramid.debug_notfound = false
pyramid.default_locale_name = fr

[server:main]
use = egg:waitress#main
host = 0.0.0.0
port = 6543

# Waitress tuning
# threads          : pool de threads workers (1 thread bloqué par requête API EnergyMe)
#                    mettre au moins 2× le nombre de canaux actifs attendus simultanément
threads = 16
# connection_limit : nombre max de connexions TCP simultanées avant refus
connection_limit = 300
# channel_timeout  : secondes max sans données sur une connexion TCP avant fermeture
channel_timeout = 30
# cleanup_interval : fréquence (s) de nettoyage des connexions mortes
cleanup_interval = 10

[loggers]
keys = root, energyme

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console

[logger_energyme]
level = DEBUG
handlers =
qualname = energyme

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s:%(lineno)s][%(threadName)s] %(message)s
